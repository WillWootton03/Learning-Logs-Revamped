# Shared location blocks for the Learning Logs nginx router.
#
# Included by both the HTTPS (domain) and localhost server blocks in
# nginx.conf, so routing rules stay defined in exactly one place.

# Vite content-hashes everything under /assets/, so those files can be cached
# forever (the hash changes when the content changes).
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# ── API → Express backend ──────────────────────────────────────────────
# Regex keeps the SPA's /app/* history routes clear of the proxy while
# catching every backend prefix. Cookies are forwarded unchanged so the
# access/refresh JWT cookies set by /auth/* reach the browser and are sent
# back on each API call.
location ~ ^/(auth|users|boards)(/.*)?$ {
  proxy_pass http://backend:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Cookie $http_cookie;
  proxy_connect_timeout 60s;
  proxy_read_timeout 60s;
}

# ── SPA ────────────────────────────────────────────────────────────────
# Everything else is the React app. Unknown paths fall back to index.html so
# client-side routes (/app/board/:id, /login, ...) still render on a hard
# refresh.
location / {
  try_files $uri $uri/ /index.html;
}
