# Learning Logs — nginx router.
#
# Serves the built React SPA and proxies API traffic to the Express backend,
# so the whole app lives behind ONE origin. The browser never talks to the
# backend directly: the httpOnly JWT auth cookies are same-site and CORS is
# out of the picture.
#
# Three server blocks:
#   :80    learning-logs.com → 301 redirect to https (direct HTTP hits to the
#                              origin get upgraded; Cloudflare also handles
#                              visitor upgrades at the edge)
#   :443   learning-logs.com → the real site over TLS: SPA + API proxy.
#                              Cloudflare's "Full (strict)" mode requires a
#                              valid origin cert — generate a free Cloudflare
#                              Origin Certificate and drop the two files into
#                              nginx/certs/ (see docker-compose.prod.yaml)
#   :80    localhost (default) → plain-HTTP app for local testing on :8080
#
# The /assets, API-proxy, and SPA-fallback locations are shared between the
# HTTPS and localhost blocks via nginx/locations.conf (copied into the image
# by Dockerfile.prod).
#
# This file is mounted into the nginx image as /etc/nginx/conf.d/default.conf
# (a server block inside the image's stock http{}), so it must NOT define
# its own http{} / events{} / user directives.

# ── Domain over plain HTTP → upgrade to HTTPS. ───────────────────────────
server {
  listen 80;
  server_name learning-logs.com www.learning-logs.com;
  return 301 https://$host$request_uri;
}

# ── Local, cert-free testing (docker-compose maps 8080:80). ──────────────
server {
  listen 80 default_server;
  server_name localhost 127.0.0.1 _;

  root /usr/share/nginx/html;
  index index.html;

  # CSV imports can carry a few MB; let them through the proxy.
  client_max_body_size 10m;

  # Compress text-like responses (HTML/CSS/JS/JSON/SVG).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  include /etc/nginx/locations.conf;
}

# ── The real site: HTTPS + domain. ───────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name learning-logs.com www.learning-logs.com;

  # Cloudflare Origin Certificate (free, 15 years) — replace the placeholder
  # files in nginx/certs/ with the real ones before enabling Full (strict).
  ssl_certificate     /etc/nginx/certs/learning-logs.pem;
  ssl_certificate_key /etc/nginx/certs/learning-logs.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  root /usr/share/nginx/html;
  index index.html;

  # CSV imports can carry a few MB; let them through the proxy.
  client_max_body_size 10m;

  # Compress text-like responses (HTML/CSS/JS/JSON/SVG).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  include /etc/nginx/locations.conf;
}
