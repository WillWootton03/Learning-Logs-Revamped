<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Logs</title>
    <script>
      // Apply the theme before the bundle loads to avoid a flash of the wrong
      // scheme. The public pages (/, /demo, /login, /signup, /verify,
      // /forgot-password, /reset-password) always follow the browser's color
      // scheme; the app pages use the saved preference (dark fallback).
      (function () {
        try {
          var path = window.location.pathname.replace(/\/+$/, "") || "/";
          var isPublic =
            path === "/" || path === "/demo" || path === "/login" || path === "/signup" ||
            path === "/verify" || path === "/forgot-password" || path === "/reset-password";
          var saved = localStorage.getItem("theme");
          var dark;
          if (isPublic) {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } else {
            dark = saved === "dark" || (saved !== "light");
          }
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
